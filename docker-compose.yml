version: '3.9'

services:
  # MongoDB Replica Set (required for transactions)
  mongo1:
    image: mongo:7
    container_name: restigo-mongo1
    command: mongod --replSet rs0 --bind_ip_all --port 27017
    ports:
      - "27017:27017"
    volumes:
      - mongo1_data:/data/db
    healthcheck:
      test: echo "try { rs.status() } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo1:27017'}]}) }" | mongosh --port 27017 --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - restigo-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: restigo-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - restigo-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: restigo-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongo1:27017/restigo?replicaSet=rs0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      mongo1:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - /app/node_modules
    networks:
      - restigo-network

  # ML Pricing Service
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: restigo-ml
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGODB_URI=mongodb://mongo1:27017/restigo?replicaSet=rs0
    depends_on:
      - redis
      - mongo1
    networks:
      - restigo-network

volumes:
  mongo1_data:
  redis_data:

networks:
  restigo-network:
    driver: bridge
